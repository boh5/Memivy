[package]
name = "memivy-core"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dirs = "=6.0.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "hooks"] }
sha2 = "0.10"
sqlite-vec = "=0.1.9"
pulldown-cmark = { version = "=0.13.0", default-features = false }
unicode-normalization = "0.1"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
tempfile.workspace = true
thiserror = "2"
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
bytes = "1"
eventsource-stream = "0.2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking", "multipart"] }

[dev-dependencies]
