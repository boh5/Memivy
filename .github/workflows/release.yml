name: Release
run-name: ${{ github.event_name == 'push' && 'Queue release' || 'Release' }} ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
      source-sha:
        description: Full commit SHA of the version tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      # Run on main so successive tags can reuse the release dependency cache.
      - name: Queue release on main for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: gh workflow run release.yml --ref main -f tag="$RELEASE_TAG" -f source-sha="$RELEASE_SHA"
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      source-sha: ${{ inputs.source-sha }}
  package:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged source is on main
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source-sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Prepare native toolchain
        id: toolchain
        run: |
          test "$(uname -m)" = arm64
          xcrun --show-sdk-version
          cmake --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-26-${{ steps.toolchain.outputs.xcode }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT DEVELOPER_DIR
          cache-bin: false
      - run: npm ci
      - run: cargo fetch --locked
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"
      - run: npm run build:release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify updater archive against the shipped public key
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          command -v minisign >/dev/null || brew install minisign
          node scripts/verify-update.mjs target/aarch64-apple-darwin/release/bundle/macos/Memivy.app.tar.gz
      - name: Build MCP verification probe
        run: cargo build --locked --offline --release --target aarch64-apple-darwin -p memivy-core --example memory_probe
      - name: Check packaged MCP
        env:
          MEMIVY_TEST_PROBE: ${{ github.workspace }}/target/aarch64-apple-darwin/release/examples/memory_probe
        run: python3 scripts/verify_mcp.py --binary target/aarch64-apple-darwin/release/bundle/macos/Memivy.app/Contents/MacOS/memivy-mcp
      - name: Check packaged main application startup
        run: python3 scripts/verify_app_startup.py --app target/aarch64-apple-darwin/release/bundle/macos/Memivy.app
      - name: Prepare assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-assets
          cp target/release/bundle/dmg/*.dmg target/release/bundle/dmg/*.sha256 release-assets/
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.RELEASE_TAG.slice(1);
          const sections = readFileSync('CHANGELOG.md', 'utf8').split(/(?=^## )/m);
          const section = sections.find(text => text.split(/\r?\n/, 1)[0] === `## ${version}`);
          if (!section || !section.slice(section.indexOf('\n') + 1).trim()) {
            throw new Error(`Missing release notes for ${version}`);
          }
          writeFileSync('release-assets/release-notes.md', section.trim() + '\n');
          NODE
          printf '\nSource commit: %s\n' "$(git rev-parse HEAD)" >> release-assets/release-notes.md
          node scripts/prepare-update.mjs target/aarch64-apple-darwin/release/bundle/macos release-assets "${RELEASE_TAG#v}" release-assets/release-notes.md
          cd release-assets
          shasum -a 256 -c *.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [verify, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh run download "$RUN_ID" --name release-assets --dir release-assets
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; inspect it manually instead of replacing assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/*.dmg release-assets/*.sha256 release-assets/*.app.tar.gz release-assets/*.sig release-assets/latest.json --verify-tag --latest --title "Memivy $RELEASE_TAG" --notes-file release-assets/release-notes.md
