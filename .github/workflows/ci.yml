name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      source-sha:
        description: Exact release commit to verify
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Prepare native toolchain
        id: toolchain
        run: |
          test "$(uname -m)" = arm64
          xcrun --show-sdk-version
          cmake --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-26-${{ steps.toolchain.outputs.xcode }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT DEVELOPER_DIR
          cache-bin: false
      - run: npm ci
      - run: cargo fetch --locked
      - run: npm run i18n:check
      - run: npm run test:core-assets
      - run: python3 scripts/verify_restore.py
      - name: Check production identity with Tauri release mode
        run: cargo test -p memivy --locked --offline --features tauri/custom-protocol storage::tests
      - name: Upload core regression diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-regression-diagnostics
          path: |
            research/core-tests/**/*.log
            research/core-tests/**/summary.json
          if-no-files-found: ignore
          retention-days: 14
