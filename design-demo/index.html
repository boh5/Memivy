<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Memivy Clickable visual Demo: Keep your ideas and where they came from.">
  <title>Memivy · Let ideas keep growing</title>
  <link rel="icon" href="mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="demo-data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-window">
    <header class="window-bar">
      <div class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <span>A memory space of your own</span>
      <span class="local-label"><span class="status-dot"></span> Local first</span>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="Memory list and search">
        <div class="brand"><img src="mark.svg" alt="" width="37" height="37"><span>memivy<span class="brand-period">.</span></span></div>
        <div class="sidebar-heading"><h1>My memories</h1><span id="memory-count" class="count"></span></div>
        <p class="sidebar-subtitle">Keep your ideas and where they came from.</p>
        <button class="button primary capture-trigger" data-action="capture"><span data-icon="plus"></span>Capture a moment<kbd>⌥ Space</kbd></button>
        <div class="search-box"><span data-icon="search"></span><input id="search" type="search" placeholder="Find an idea…" aria-label="Search memories" autocomplete="off"><kbd>⌘ K</kbd></div>
        <div class="filter-tabs" role="group" aria-label="Filter by source">
          <button data-filter="all" aria-pressed="true">All</button>
          <button data-filter="mine" aria-pressed="false">My notes</button>
          <button data-filter="agent" aria-pressed="false">From Agent</button>
        </div>
        <div class="list-caption"><span id="list-label">Recently updated</span><span id="result-count"></span></div>
        <nav id="memory-list" class="memory-list" aria-label="Memories"></nav>
        <footer class="sidebar-footer">
          <button class="service-control" data-action="menu" aria-label="Menu bar preview"><span class="status-dot" id="service-dot"></span><span id="service-label">Memivy available</span><span data-icon="chevron-up"></span></button>
          <button class="icon-button" data-action="settings" aria-label="Open settings" title="Settings"><span data-icon="settings"></span></button>
        </footer>
      </aside>
      <main class="main-pane" id="main-pane" aria-label="Current memory and original notes">
        <div id="detail-toolbar" class="detail-toolbar"></div>
        <div id="detail-scroll" class="detail-scroll"><article id="memory-detail"></article></div>
      </main>
    </div>
  </div>
  <footer class="demo-dock" aria-label="Demo controls">
    <span class="demo-sign"><span class="demo-dot"></span><strong>Visual Demo</strong><span>v0.1</span></span>
    <span class="demo-disclaimer">Sample data · Resets on refresh · No model connection</span>
    <div class="demo-tools">
      <label for="scenario">Try a scenario</label>
      <select id="scenario" aria-label="Demo scenario">
        <option value="everyday">Everyday use</option><option value="append">Add to an existing memory</option><option value="new">Create a memory</option><option value="uncertain">Leave unassigned</option><option value="agent">Agent input</option><option value="processing">AI processing</option><option value="failed">AI connection failed</option><option value="unconfigured">No model configured</option><option value="empty">Empty library</option><option value="no-results">No search results</option><option value="long">Long-form reading</option>
      </select>
      <button class="dock-button" data-action="reset" title="Restore sample data">Reset</button>
      <button class="dock-button" data-action="about" aria-label="View design notes"><span data-icon="info"></span></button>
    </div>
  </footer>
  <section id="receipt" class="receipt" aria-live="polite" aria-atomic="true" hidden></section>
  <button id="last-receipt" class="last-receipt button secondary" data-action="last-receipt" hidden><span data-icon="check"></span>View last action</button>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="capture-dialog" class="capture-dialog" aria-labelledby="capture-title"></dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title"></dialog>
  <dialog id="history-dialog" class="history-dialog" aria-labelledby="history-title"></dialog>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title"></dialog>
  <dialog id="menu-dialog" class="menu-dialog" aria-labelledby="menu-title"></dialog>
  <dialog id="about-dialog" class="about-dialog" aria-labelledby="about-title"></dialog>
</body>
</html>
