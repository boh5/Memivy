[workspace]
members = ["crates/memivy-core", "crates/memivy-mcp", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
memivy-core = { path = "crates/memivy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "process", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[profile.dev]
debug = 1
