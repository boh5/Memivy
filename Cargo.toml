[workspace]
members = ["crates/memivy-core", "crates/memivy-mcp", "crates/memivy-embedding", "crates/memivy-speech", "src-tauri"]
resolver = "2"

[workspace.package]
license = "MIT"
authors = ["Huang Bo"]
repository = "https://github.com/boh5/memivy"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
memivy-core = { path = "crates/memivy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "process", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[profile.dev]
debug = 1

# Keep full-scan vector arithmetic representative in native development QA.
[profile.dev.package.sqlite-vec]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
